<!DOCTYPE html> <!--This is setting the doctype to HTML5, allowing browsers to know what programming language the code is in-->
<html> <!--This is an opening HTML tag, which specifies that everything between this tag and the closing HTML tag is written in HTML-->
    <head> <!--This is an opening head tag, which indicates that everything between this tag and the closing head tag is metadata about the website-->
        <title>My First Webpage</title> <!--This sets the title of the webpage to "My First Webpage", which will appear as text in the browser tab-->
    </head> <!--This is a closing head tag, which indicates that everything between this tag and the opening head tag is metadata about the website-->
    <body> <!--This is an opening body tag, which indicates that everything between this tag and the closing body tag is what is actually meant to display on the webpage (i.e. what elements the webpage actually consists of)-->
        <h1>This is my first webpage :)</h1> <!--This displays heading 1 text, the largest heading, that states "This is my first webpage :)"-->
        <h3><strong>Username:</strong> ser29-bit</h3> <!--This displays heading 3 text, the 3rd largest heading, with text that states "Username: ser29-bit" with "Username:" in bold-->
        <h3><strong>Course name:</strong> Introduction to Website Development</h3> <!--This displays heading 3 text, the 3rd largest heading, with text that states "Course name: Introduction to Website Development" with "Course name:" in bold-->
        <h3><strong>Course number:</strong> IS117</h3> <!--This displays heading 3 text, the 3rd largest heading, with text that states "Course number: IS117" with "Course number:" in bold-->
        <h3><strong>Course section:</strong> 002</h3> <!--This displays heading 3 text, the 3rd largest heading, with text that states "Course section: 002" with "Course section:" in bold-->
        <footer> <!--This is an opening footer tag, which indicates that everything between this tag and the closing footer tag is a part of the bottom or footer of the webpage-->
            <p>&copy;Sophia Rollo | March 3 2026</p> <!--This displays paragraph text that starts with a copyright symbol followed by "Sophia Rollo | March 3 2026"--> 
        </footer> <!--This is a closing footer tag, which indicates that everything between this tag and the opening footer tag is a part of the bottom or footer of the webpage-->
    </body> <!--This a closing body tag, which indicates that everything between this tag and the opening body tag is what is the body of the webpage, or what is actually displayed on the webpage-->

</html> <!--This is a closing html tag, which indicates that everything between this tag and the opening html tag is written in HTML-->
